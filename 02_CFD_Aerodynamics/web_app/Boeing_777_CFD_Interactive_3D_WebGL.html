<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boeing 777 - CFD Interactive 3D Aerodynamics Platform</title>
    <style>
        body { margin: 0; background: #06090e; color: #e6edf3; font-family: monospace; overflow: hidden; }
        #canvas3d { width: 100vw; height: 100vh; display: block; }
        .hud-panel { position: absolute; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(8px); border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
        #controls { top: 20px; left: 20px; width: 320px; }
        #telemetry { bottom: 20px; right: 20px; width: 280px; }
        h2 { font-size: 14px; color: #58a6ff; margin-top: 0; }
        .row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 12px; }
        input[type=range] { width: 100%; accent-color: #58a6ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas3d"></div>
    <div id="controls" class="hud-panel">
        <h2>✈️ Transonic CFD Aerodynamics</h2>
        <div class="row"><span>Mach Number:</span><strong id="mach-val">0.84</strong></div>
        <input type="range" id="mach-slider" min="0.2" max="0.95" step="0.01" value="0.84">
        
        <div class="row" style="margin-top: 10px;"><span>Angle of Attack:</span><strong id="aoa-val">2.5°</strong></div>
        <input type="range" id="aoa-slider" min="-2" max="14" step="0.5" value="2.5">
        
        <div class="row" style="margin-top: 10px;"><span>Streamline Density:</span><strong id="density-val">5,000</strong></div>
        <input type="range" id="density-slider" min="1000" max="10000" step="1000" value="5000">
    </div>
    <div id="telemetry" class="hud-panel">
        <h2>📊 Real-Time Aero Coefficients</h2>
        <div class="row"><span>Lift Coeff (CL):</span><strong id="cl-val" style="color: #3fb950;">0.528</strong></div>
        <div class="row"><span>Drag Coeff (CD):</span><strong id="cd-val" style="color: #f85149;">0.0294</strong></div>
        <div class="row"><span>Lift/Drag (L/D):</span><strong id="ld-val" style="color: #58a6ff;">17.96</strong></div>
        <div class="row"><span>Total Lift:</span><strong id="lift-val">2,714 kN</strong></div>
        <div class="row"><span>Total Drag:</span><strong id="drag-val">151 kN</strong></div>
    </div>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x06090e, 0.008);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(45, 20, 65);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas3d').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Aircraft geometry representation
        const aircraft = new THREE.Group();
        const fuseMat = new THREE.MeshStandardMaterial({ color: 0x90a4ae, metalness: 0.8, roughness: 0.2 });
        const fuse = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 60, 24), fuseMat);
        fuse.rotation.z = Math.PI / 2;
        aircraft.add(fuse);
        
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x607d8b, metalness: 0.7, roughness: 0.3 });
        const wing = new THREE.Mesh(new THREE.BoxGeometry(62, 0.5, 8), wingMat);
        aircraft.add(wing);
        scene.add(aircraft);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(20, 50, 20);
        scene.add(sun);

        // Particle Streamlines
        const pCount = 5000;
        const pGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(pCount * 3);
        const colors = new Float32Array(pCount * 3);

        for (let i = 0; i < pCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 60;
            positions[i*3+1] = (Math.random() - 0.5) * 15;
            positions[i*3+2] = -40 + Math.random() * 80;
            colors[i*3] = 0.2; colors[i*3+1] = 0.6; colors[i*3+2] = 1.0;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const pMat = new THREE.PointsMaterial({ size: 0.6, vertexColors: true, transparent: true, opacity: 0.75 });
        const particleSystem = new THREE.Points(pGeo, pMat);
        scene.add(particleSystem);

        function updateTelemetry() {
            const m = parseFloat(document.getElementById('mach-slider').value);
            const a = parseFloat(document.getElementById('aoa-slider').value);
            document.getElementById('mach-val').innerText = m.toFixed(2);
            document.getElementById('aoa-val').innerText = a.toFixed(1) + '°';

            const cl = (0.105 * (a + 1.2)).toFixed(3);
            const cd = (0.015 + (cl * cl) / (3.14159 * 9.61 * 0.875) + (m > 0.85 ? 0.008 : 0.0)).toFixed(4);
            const ld = (cl / cd).toFixed(2);

            document.getElementById('cl-val').innerText = cl;
            document.getElementById('cd-val').innerText = cd;
            document.getElementById('ld-val').innerText = ld;
            document.getElementById('lift-val').innerText = Math.round(cl * 5140) + ' kN';
            document.getElementById('drag-val').innerText = Math.round(cd * 5140) + ' kN';
        }

        document.getElementById('mach-slider').addEventListener('input', updateTelemetry);
        document.getElementById('aoa-slider').addEventListener('input', updateTelemetry);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const pos = particleSystem.geometry.attributes.position.array;
            const m = parseFloat(document.getElementById('mach-slider').value);
            const speed = m * 1.5;

            for (let i = 0; i < pCount; i++) {
                pos[i*3+2] += speed;
                if (pos[i*3+2] > 40) {
                    pos[i*3+2] = -40;
                    pos[i*3] = (Math.random() - 0.5) * 60;
                    pos[i*3+1] = (Math.random() - 0.5) * 15;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
